name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analise:
    name: Análise estática (C#)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual

      # Só o código de produção: os testes não precisam de análise de segurança
      - name: Build
        run: dotnet build src/Aurora.Api/Aurora.Api.csproj --configuration Release

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:csharp
