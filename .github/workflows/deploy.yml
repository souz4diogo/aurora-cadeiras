name: Deploy

# CD (docs/09 §3): imagens no ACR -> hom (automático a cada merge na main) -> prod (aprovação manual).
# Só roda quando a variável do repositório AZURE_DEPLOY_ATIVO for "true", para a main continuar verde enquanto a
# infraestrutura (infra/) não foi criada ou o grupo não tem assinatura Azure.
#
# Produção: tag "v*" (ex.: v1.0.0) ou execução manual escolhendo "prod". O GitHub Environment "prod" exige aprovação
# de um revisor antes de o job começar (configurar em Settings > Environments).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ambiente:
        description: Até onde implantar
        type: choice
        options: [hom, prod]
        default: hom

# Um deploy por vez; um deploy em andamento não é cancelado no meio
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  imagens:
    name: Publicar imagem ${{ matrix.imagem }} no ACR
    if: vars.AZURE_DEPLOY_ATIVO == 'true'
    runs-on: ubuntu-latest
    environment: hom
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: true
      matrix:
        imagem: [api, web, dbup]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login no Azure (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login no ACR
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build e push (tag = SHA do commit)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.imagem }}
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/aurora-${{ matrix.imagem }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.imagem }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagem }}

  hom:
    name: Homologação
    needs: imagens
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/implantar.yml
    with:
      ambiente: hom
      sha: ${{ github.sha }}

  prod:
    name: Produção
    needs: hom
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.ambiente == 'prod')
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/implantar.yml
    with:
      ambiente: prod
      sha: ${{ github.sha }}
      importar-de: ${{ vars.ACR_HOM }}
